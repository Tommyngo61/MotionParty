name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  GO_VERSION: "1.23"

jobs:
  unit:
    name: Lint and unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meternode-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: meternode-console/go.sum

      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meternode-console
    services:
      postgres:
        # Must match deploy/docker-compose.yml: the migrations create
        # hypertables and continuous aggregates directly, so plain Postgres
        # will not do.
        image: timescale/timescaledb:2.17.2-pg16
        env:
          POSTGRES_USER: meternode
          POSTGRES_PASSWORD: meternode
          POSTGRES_DB: meternode
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U meternode -d meternode"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: meternode-console/go.sum

      - name: Migrate
        env:
          METERNODE_DATABASE_URL: postgres://meternode:meternode@localhost:5432/meternode?sslmode=disable
        run: go run ./cmd/controller migrate

      - name: Integration tests
        env:
          METERNODE_TEST_DATABASE_URL: postgres://meternode:meternode@localhost:5432/meternode?sslmode=disable
        run: go test -tags integration -race -count=1 ./internal/store/

  schema:
    name: Wire schema
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: meternode-proto
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: meternode-proto/go.sum
      - run: go vet ./...
      # -v so the bandwidth accounting shows up in the job log. If a change
      # pushes a node's projected monthly traffic up, that is a number a
      # reviewer should see rather than a test that silently still passes.
      - run: go test -race -v -run TestMonthlyBudget ./...
      - run: go test -race ./...
