# The MeterNode Console development stack.
#
#   make dev        # bring it up
#   make simulate   # point simulated nodes at it
#
# Everything here is a DEVELOPMENT configuration. The bootstrap admin token and
# the generated signing key below are refused outside METERNODE_ENV=dev by both
# config.Validate and store.EnsureBootstrapAdmin.

name: meternode

services:
  postgres:
    # TimescaleDB is a hard requirement: the fleet grid is built entirely out of
    # continuous aggregates, and the migrations create hypertables directly.
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: meternode
      POSTGRES_PASSWORD: meternode
      POSTGRES_DB: meternode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meternode -d meternode"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    # Redis holds live node state and fans command messages out across
    # controller replicas: a node's socket lands on ONE replica, but an operator
    # may issue a command against any of them.
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  controller:
    build:
      # The build context is the PARENT directory so the sibling
      # meternode-proto module is reachable. Once proto is split into its own
      # repository this becomes a plain `.`.
      context: ../..
      dockerfile: meternode-console/deploy/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      METERNODE_ENV: dev
      METERNODE_HTTP_ADDR: ":8080"
      METERNODE_PUBLIC_URL: "http://localhost:8080"
      METERNODE_DATABASE_URL: "postgres://meternode:meternode@postgres:5432/meternode?sslmode=disable"
      METERNODE_REDIS_URL: "redis://redis:6379/0"
      METERNODE_LOG_FORMAT: text
      METERNODE_LOG_LEVEL: debug
      # Dev only. Both config.Validate and store.EnsureBootstrapAdmin refuse
      # this outside METERNODE_ENV=dev.
      METERNODE_BOOTSTRAP_ADMIN_TOKEN: "dev-admin-token"
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "/usr/local/bin/controller", "version"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Not started by default. `docker compose run --rm simulator -n 200` or use
  # `make simulate`, which runs it on the host so flags are easier to pass.
  simulator:
    profiles: ["sim"]
    build:
      context: ../..
      dockerfile: meternode-console/deploy/Dockerfile
    entrypoint: ["/usr/local/bin/simulator"]
    depends_on:
      - controller
    environment:
      METERNODE_CONTROLLER_URL: "http://controller:8080"
      METERNODE_BOOTSTRAP_ADMIN_TOKEN: "dev-admin-token"
    command: ["-n", "50"]

volumes:
  pgdata:
