<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Motion Party</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎮</text></svg>" />
<style>
  html,body{height:100%;margin:0;font-family:'Segoe UI',system-ui,sans-serif;
    background:linear-gradient(180deg,#eaf6ff 0%,#ffffff 55%);color:#16233d;
    display:flex;align-items:center;justify-content:center;text-align:center}
  h1{font-size:3rem;margin:0 0 .2rem;text-shadow:0 4px 0 rgba(0,0,0,.25)}
  p{opacity:.8;margin-top:0}
  .links{display:flex;gap:1rem;justify-content:center;margin-top:2rem}
  a.btn{background:#ff5da2;color:#fff;text-decoration:none;padding:1rem 2rem;
    border-radius:14px;font-weight:700;font-size:1.1rem;box-shadow:0 6px 0 #b8296b}
  a.btn.alt{background:#3fd0c9;box-shadow:0 6px 0 #1f8f89}
</style>
</head>
<body>
  <div>
    <h1>🎮 Motion Party</h1>
    <p>Swing, aim, and duel with your phone.</p>
    <div class="links">
      <a class="btn" href="/host/">Put this on the TV</a>
      <a class="btn alt" href="/player/">Join as a Player</a>
    </div>
  </div>
</body>
</html>
